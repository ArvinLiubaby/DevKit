# 发布流水线：推送版本 tag（如 v0.1.0）触发矩阵构建
# Windows → NSIS 安装包（自动更新签名 + latest.json）
# Linux → deb 安装包
# 产物由 tauri-action 上传到 GitHub Releases
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb
          - platform: macos-latest
            args: --bundles dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖（WebKitGTK 等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevKit ${{ github.ref_name }}"
          releaseBody: |
            自动构建发布：DevKit ${{ github.ref_name }}
            - Windows: NSIS 安装包（支持应用内自动更新）
            - Linux: deb 安装包（依赖 libwebkit2gtk-4.1-0 / libgtk-3-0 / librsvg2-2）
            - macOS: dmg 安装包（未签名，首次打开请右键→打开）
            更新清单 latest.json 已由构建流程自动生成并签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
