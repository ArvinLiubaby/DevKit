# 发布流水线：macOS 安装包（手动触发，默认不打包）
# Windows NSIS / Linux deb 走本地构建：scripts/build-win.ps1、build-deb.sh
# 需要 macOS 包时手动运行本 workflow 并填写 tag 名称
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag 名称（如 v0.5.3）"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "DevKit ${{ inputs.tag }}"
          createUpdaterArtifacts: v2Compatible
          releaseBody: |
            手动构建发布：DevKit ${{ inputs.tag }}
            - macOS: dmg 安装包（未签名，首次打开请右键→打开）
            - Windows: NSIS 安装包（本地构建 scripts/build-win.ps1）
            - Linux: deb 安装包（本地构建 scripts/build-deb.sh）
            更新清单 latest.json 已由构建流程自动生成并签名。
          releaseDraft: false
          prerelease: false
          args: --bundles app,dmg
