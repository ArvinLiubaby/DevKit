# 发布流水线：推送版本 tag（如 v0.1.0）触发 macOS 构建
# 仅构建 macOS dmg（Windows NSIS / Linux deb 走本地构建：scripts/build-win.ps1、build-deb.sh）
# 产物由 tauri-action 上传到 GitHub Releases
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DevKit ${{ github.ref_name }}"
          createUpdaterArtifacts: v2Compatible
          releaseBody: |
            自动构建发布：DevKit ${{ github.ref_name }}
            - macOS: dmg 安装包（未签名，首次打开请右键→打开）
            - Windows: NSIS 安装包（本地构建 scripts/build-win.ps1）
            - Linux: deb 安装包（本地构建 scripts/build-deb.sh）
            更新清单 latest.json 已由构建流程自动生成并签名。
          releaseDraft: false
          prerelease: false
          args: --bundles app,dmg
